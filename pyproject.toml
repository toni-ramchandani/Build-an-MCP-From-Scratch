[project]
name = "build-an-mcp-from-scratch"
version = "0.2.0"
description = "Verified companion server for Build an MCP from Scratch"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "mcp[cli]==2.0.0",
    "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
github = [
    "PyGithub>=2.8,<3",
]
browser = [
    "playwright>=1.55,<2",
]
integrations = [
    "PyGithub>=2.8,<3",
    "playwright>=1.55,<2",
]
dev = [
    "hatchling>=1.27,<2",
    "jsonschema>=4.26,<5",
    "pyright>=1.1.403,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<0.13",
]

[project.scripts]
build-an-mcp-server = "build_an_mcp_server.server:main"
build-an-mcp-server-http = "build_an_mcp_server.http_server:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/build_an_mcp_server"]

[tool.uv]
required-version = "==0.11.33"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires an external service, credential, or browser binary",
    "runtime: crosses a process or network transport boundary",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.10"
include = ["src", "examples", "scripts", "tests"]
exclude = [".venv"]
reportMissingTypeStubs = false
reportUnusedFunction = false