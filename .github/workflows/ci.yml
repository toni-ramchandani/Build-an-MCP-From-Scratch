name: repository-proof

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.33"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the locked core and proof dependencies
        run: uv sync --locked --extra dev

      - name: Run deterministic proof gates
        run: uv run --frozen python scripts/verify.py